name: Check TV programs
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-next-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run poll
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          ENABLE_TBS: ${{ vars.ENABLE_TBS }}
          ENABLE_NTV: ${{ vars.ENABLE_NTV }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          NHK_API_KEY: ${{ secrets.NHK_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
